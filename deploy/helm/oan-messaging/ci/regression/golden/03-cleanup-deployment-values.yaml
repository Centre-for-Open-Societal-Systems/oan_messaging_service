# Source: oan-messaging/templates/migration-job.yaml
# Hook resources run before the chart's normal resources exist (install) or alongside the
# previous release's resources (upgrade), so the migration has its own hook ServiceAccount
# and NetworkPolicy, and reads only the migration database URL (no storage keys, no
# ConfigMap, no runtime credentials).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oan-msg-oan-messaging-migration
  labels:
    helm.sh/chart: oan-messaging-0.1.0-draft.2
    app.kubernetes.io/name: oan-messaging
    app.kubernetes.io/instance: oan-msg
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oan-messaging
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false


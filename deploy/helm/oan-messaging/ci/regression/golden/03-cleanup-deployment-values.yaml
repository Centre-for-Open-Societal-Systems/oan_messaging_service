# Source: oan-messaging/templates/migration-job.yaml
# Serialized schema migration for THIS release: one Job, one pod, no parallelism, no
# retries. On install it completes before Helm creates any workload. On upgrade the
# previous release's workloads keep running during it, so migrations must be backward
# compatible. Helm's release lock stops two operations on this release from running hooks
# at once; it is NOT a database-wide lock (see docs/deployment/helm.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: oan-msg-oan-messaging-migration
  labels:
    helm.sh/chart: oan-messaging-0.1.0-draft.2
    app.kubernetes.io/name: oan-messaging
    app.kubernetes.io/instance: oan-msg
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oan-messaging
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
    oan.coss/migration-network-mode: "unrestricted"
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        helm.sh/chart: oan-messaging-0.1.0-draft.2
        app.kubernetes.io/name: oan-messaging
        app.kubernetes.io/instance: oan-msg
        app.kubernetes.io/component: migration
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: oan-messaging
    spec:
      restartPolicy: Never
      serviceAccountName: oan-msg-oan-messaging-migration
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.example.invalid/oan/oan-messaging:0.1.0-placeholder
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - alembic
            - -c
            - migrations/alembic.ini
            - upgrade
            - head
          env:
            # Read by migrations/env.py.
            - name: OAN_MSG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oan-messaging-database
                  key: migration-url
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            privileged: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}


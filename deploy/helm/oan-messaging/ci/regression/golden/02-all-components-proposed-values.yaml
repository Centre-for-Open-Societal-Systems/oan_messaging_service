# Source: oan-messaging/templates/migration-job.yaml
# Hook-scoped network access for the migration pod, created before the Job (weight -5) so
# it applies on first install and carries the NEW values on upgrade. Ingress: none.
# Egress: DNS and PostgreSQL only. Deleted after the hook phase succeeds; kept on failure
# for debugging (replaced on the next attempt).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oan-msg-oan-messaging-migration-egress
  labels:
    helm.sh/chart: oan-messaging-0.1.0-draft.2
    app.kubernetes.io/name: oan-messaging
    app.kubernetes.io/instance: oan-msg
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oan-messaging
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oan-messaging
      app.kubernetes.io/instance: oan-msg
      app.kubernetes.io/component: migration
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock: {cidr: "10.0.20.0/24"}
      ports:
        - {port: 5432, protocol: TCP}


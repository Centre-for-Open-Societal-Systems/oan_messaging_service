[project]
name = "oan_messaging_connector"
authors = [{ name = "OpenAgriNet", email = "admin@openagrinet.org" }]
description = "Reusable Frappe app that sends SMS through the OAN Messaging Service (outbox, dispatch, status polling)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = ["httpx>=0.27,<1.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# House style of the OAN Frappe apps (same settings as oan_grievance_service).
[tool.ruff]
line-length = 110
target-version = "py311"
# The OAN client and dispatch logic are vendored unchanged from oan_messaging_services
# (examples/oan_client), which lints them with its own settings. Keep them byte-identical.
extend-exclude = ["oan_messaging_connector/vendor"]
force-exclude = true

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
	"B017", # assertRaises(Exception) - should be more specific
	"B018", # useless expression, not assigned to anything
	"B023", # function doesn't bind loop variable - will have last iteration's value
	"B904", # raise inside except without from
	"E101", # indentation contains mixed spaces and tabs
	"E402", # module level import not at top of file
	"E501", # line too long
	"E741", # ambiguous variable name
	"F401", # "unused" imports
	"F403", # can't detect undefined names from * import
	"F405", # can't detect undefined names from * import
	"F722", # syntax error in forward type annotation
	"W191", # indentation contains tabs
	"UP030", # Use implicit references for positional format fields (translations)
	"UP031", # Use format specifiers instead of percent format
	"UP032", # Use f-string instead of `format` call (translations)
	"UP037", # quoted annotations
	"UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

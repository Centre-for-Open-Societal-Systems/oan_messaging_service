# CI for the portable repository (MSG-08). Not yet run on any hosted runner: no remote
# repository exists. Mocked providers and a throwaway PostgreSQL service only.
name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: ci-only-throwaway}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      OAN_MSG_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . --extend-exclude docs   # docs/ holds standalone analysis scripts
      - run: uv run mypy -p oan_messaging
      - run: uv run python -m oan_messaging.contracts
      - run: PYTHONPATH=.:examples uv run pytest tests -q
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: deploy/helm/oan-messaging/ci/run-regressions.sh
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t oan-messaging:ci .
      - run: test "$(docker run --rm oan-messaging:ci id -u)" = 10001

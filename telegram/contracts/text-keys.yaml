  link.ask_contact: {en: "Please tap Share my phone number.", am: "[am] link.ask_contact"}
  link.code_sent: {en: "We sent a code by SMS to your registered phone ending in {masked_phone}. Please type it here.", am: "[am] link.code_sent", params: [masked_phone]}
  link.not_found: {en: "We could not link this Farmer ID. Please visit your kebele office.", am: "[am] link.not_found"}
  link.not_own_contact: {en: "Please share your own phone number using the button.", am: "[am] link.not_own_contact"}
  link.rate_limited: {en: "Too many codes were requested. Please try again later.", am: "[am] link.rate_limited"}
  link.code_invalid: {en: "That code is not correct. Please try again.", am: "[am] link.code_invalid"}
  link.code_expired: {en: "That code has expired. Please start again.", am: "[am] link.code_expired"}
  link.locked: {en: "Linking is paused for one hour after too many wrong codes.", am: "[am] link.locked"}
  link.done: {en: "Your Farmer ID is linked. You will receive official updates for your area.", am: "[am] link.done"}
  link.ask_registry_kebele: {en: "Your registered kebele is {kebele_name}. Send your questions there?", am: "[am] link.ask_registry_kebele", params: [kebele_name]}

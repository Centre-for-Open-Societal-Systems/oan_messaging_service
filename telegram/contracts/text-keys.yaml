# Text keys for Phase A (TG-02, spec §5.5).
#
# Every farmer- and staff-facing string is keyed by these ids. With RapidPro (the old
# runtime) they are flow translations and Bot Services returns keys and params. Without
# RapidPro (Telegram broadcasts plus sign-up) Bot Services itself renders the reply from this
# file (`en` or `am`, by the chat's chosen language) and sends it through OAN Messaging;
# nothing else is ever sent as a reply. A contract test fails if Bot Services can emit a
# key that is not in this file.
#
# `en` is draft wording for tests. `am` is a placeholder ("[am] ...") until the OAN Telegram
# Bot copy and translation sheet is translated and reviewed by a native Amharic speaker
# (§5.5). Buttons (`btn.*`) stay at most 30 characters.
#
# params: names listed must be supplied; they are never a phone number, chat id or token.

common:
  common.invalid_choice: {en: "Please choose one of the options below.", am: "[am] common.invalid_choice"}
  common.unavailable: {en: "This information is not available right now. Please try again later.", am: "[am] common.unavailable"}
  common.main_menu: {en: "Main menu", am: "[am] common.main_menu"}
  common.session_expired: {en: "We have returned you to the Main menu.", am: "[am] common.session_expired"}
  common.not_read: {en: "Messages here are not read or answered. Please use the buttons below.", am: "[am] common.not_read"}

onboarding:
  onboarding.choose_language: {en: "Welcome to OpenAgriNet. Please choose your language.", am: "[am] onboarding.choose_language"}
  onboarding.privacy_notice:
    en: "Before we start: what the bot keeps and for how long. (Full text from the approved privacy notice, §5.4; states the configured retention of {retention_days} days and webhook log retention of {log_days} days.)"
    am: "[am] onboarding.privacy_notice"
    params: [retention_days, log_days]
  onboarding.link_offer: {en: "Link your Farmer ID to receive official updates for your area.", am: "[am] onboarding.link_offer"}
  onboarding.kebele_confirm: {en: "Is your kebele {kebele_name}?", am: "[am] onboarding.kebele_confirm", params: [kebele_name]}
  onboarding.choose_region: {en: "Choose your region.", am: "[am] onboarding.choose_region"}
  onboarding.choose_zone: {en: "Choose your zone.", am: "[am] onboarding.choose_zone"}
  onboarding.choose_woreda: {en: "Choose your woreda.", am: "[am] onboarding.choose_woreda"}
  onboarding.choose_kebele: {en: "Choose your kebele.", am: "[am] onboarding.choose_kebele"}
  onboarding.kebele_saved: {en: "Your kebele is {kebele_name}.", am: "[am] onboarding.kebele_saved", params: [kebele_name]}

menu:

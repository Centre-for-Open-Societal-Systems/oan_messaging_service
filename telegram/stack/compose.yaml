# Local Telegram stack: Telegram broadcasts plus sign-up, without RapidPro. See README.md.
#   ./init-env.sh && ./up.sh && (cd ../.. && pytest telegram/tests)
#
# Every service sits on `stack`, an internal network with no route to the internet. The
# only exception is `edge`, which also joins `edge` so the host can reach a fixed list of
# loopback ports; its own outbound traffic is firewalled to the stack subnet.
# Secrets come from .env (generated by init-env.sh, git-ignored) and are passed to each
# service by name, only where needed.
name: oan-tg

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [stack]
  restart: unless-stopped

x-tools: &tools
  <<: *hardened
  image: oan-tg/tools:local
  build: {context: ./tools, dockerfile: ../images/tools/Dockerfile}

x-oan: &oan
  <<: *hardened
  image: oan-tg/oan-messaging:local
  build:
    context: ./images/oan-messaging
    additional_contexts: {base: "service:certs"}
  volumes: [certs:/certs:ro]

x-bot: &bot
  <<: *hardened
  image: oan-tg/bot-services:local
  build:
    context: ../..
    dockerfile: telegram/stack/images/bot-services/Dockerfile
    additional_contexts: {base: "service:certs"}
  volumes: [certs:/certs:ro]
  environment:
    OAN_BOT_ENV: local
    OAN_BOT_DATABASE_URL: postgresql+psycopg://oan_bot:${OAN_BOT_DB_PW}@oan-db:5432/oan_bot
    OAN_BOT_RAPIDPRO_ENABLED: "false"
    OAN_BOT_TELEGRAM_WEBHOOK_SECRET: ${TG_WEBHOOK_SECRET:?run ./init-env.sh first}
    OAN_BOT_CONTACT_REF_KEY: ${CONTACT_REF_KEY}
    OAN_BOT_FINGERPRINT_KEY: ${BOT_FINGERPRINT_KEY}
    OAN_BOT_DATA_KEY: ${BOT_DATA_KEY}
    # Hash only; the token itself stays in .env for the tests (the DA backend's role).
    OAN_BOT_BROADCAST_TOKEN_SHA256: ${BOT_BROADCAST_TOKEN_SHA256}
    OAN_BOT_CLIENT_ID: ${OAN_STUBS_CLIENT_ID}
    OAN_BOT_CLIENT_SECRET: ${OAN_STUBS_CLIENT_SECRET}
    OAN_BOT_TOKEN_URL: http://stubs:8200/auth/token
    OAN_BOT_DA_URL: http://stubs:8200/da
    OAN_BOT_AUTH_URL: http://stubs:8200/auth
    OAN_BOT_BENEFICIARY_URL: http://stubs:8200/beneficiary
    OAN_BOT_MASTER_DATA_URL: http://stubs:8200/master-data
    OAN_BOT_OAN_MSG_URL: https://oan-api:8000
    # Filled by up.sh after it issues the caller credential.
    OAN_BOT_OAN_MSG_TOKEN: ${OAN_MSG_BOT_SERVICES_TOKEN:-}

x-oan-keys: &oan-keys
  OAN_MSG_DATABASE_URL: postgresql+psycopg://oan_msg_runtime:${OAN_RUNTIME_PW}@oan-db:5432/oan_messaging
  OAN_MSG_CONTENT_KEYS: ${OAN_MSG_CONTENT_KEYS}
  OAN_MSG_CONTENT_KEY_CURRENT: ${OAN_MSG_CONTENT_KEY_CURRENT}
  OAN_MSG_FINGERPRINT_KEYS: ${OAN_MSG_FINGERPRINT_KEYS}
  OAN_MSG_FINGERPRINT_KEY_CURRENT: ${OAN_MSG_FINGERPRINT_KEY_CURRENT}
  OAN_MSG_CREDENTIAL_PEPPER: ${OAN_MSG_CREDENTIAL_PEPPER}

# The Telegram-only broadcast switch, as Helm sets it: the api and the Telegram worker
# (and caller registration, which checks it). SMS broadcasts stay closed.
x-oan-tg-keys: &oan-tg-keys
  <<: *oan-keys
  OAN_MSG_TELEGRAM_BROADCAST_ENABLED: "true"

services:
  # ---------------------------------------------------------------- one-shot jobs
  certs:
    # The repository's OAN Messaging image (root Dockerfile); also the base of the
    # oan-messaging and bot-services images.
    image: oan-tg/oan-messaging-base:local
    build: {context: ../.., dockerfile: Dockerfile}
    user: root
    network_mode: none
    command: [python, /tools/gen_certs.py, /certs]
    volumes: [certs:/certs, ./tools:/tools:ro]
    mem_limit: 128m

  oan-migrate:
    <<: *oan
    restart: "no"
    environment:
      OAN_MSG_DATABASE_URL: postgresql+psycopg://oan_msg_owner:${OAN_OWNER_PW}@oan-db:5432/oan_messaging
    command: [alembic, -c, migrations/alembic.ini, upgrade, head]
    depends_on:
      oan-db: {condition: service_healthy}
      certs: {condition: service_completed_successfully}
    mem_limit: 192m

  oan-grants:
    <<: *hardened
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: "no"
    user: "70:70"
    environment: {PGPASSWORD: "${OAN_OWNER_PW}"}
    volumes: ["../../deploy/sql/grants.sql:/grants.sql:ro"]
    command: [psql, -h, oan-db, -U, oan_msg_owner, -d, oan_messaging, -v, ON_ERROR_STOP=1,
              -v, runtime_role=oan_msg_runtime, -v, owner_role=oan_msg_owner, -f, /grants.sql]
    depends_on: {oan-migrate: {condition: service_completed_successfully}}
    mem_limit: 64m

  oan-setup:
    # Run by up.sh for operator commands (caller registration, credentials, resume).
    <<: *oan
    restart: "no"
    profiles: [setup]
    environment: *oan-tg-keys
    command: [python, -m, oan_messaging.runtime, status]
    mem_limit: 192m

  tg-setup:
    # Run by up.sh: registers the webhook at the fake Telegram with the secret, as DevOps
    # would with setWebhook.
    <<: *tools
    restart: "no"
    profiles: [setup]
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      TG_WEBHOOK_SECRET: ${TG_WEBHOOK_SECRET}
    volumes: [certs:/certs:ro]
    command: [python, /tools/set_webhook.py]
    mem_limit: 64m

  # ---------------------------------------------------------------- store
  oan-db:
    <<: *hardened
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    user: "70:70"
    tmpfs: [/tmp, /var/run/postgresql]
    environment:
      POSTGRES_PASSWORD: ${OAN_PG_SUPERUSER_PW}
      OAN_OWNER_PW: ${OAN_OWNER_PW}
      OAN_RUNTIME_PW: ${OAN_RUNTIME_PW}
      OAN_BOT_DB_PW: ${OAN_BOT_DB_PW}
    command: [postgres, -c, shared_buffers=16MB, -c, max_connections=60]
    volumes:
      - oan-db:/var/lib/postgresql/data
      - ./tools/oan-db-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d oan_messaging"], interval: 3s, retries: 40}
    mem_limit: 160m

  # ---------------------------------------------------------------- fakes and stubs
  fake-telegram:
    <<: *tools
    command: [python, /tools/fake_telegram.py]
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    networks:
      stack:
        aliases: [api.telegram.org]
    volumes: [certs:/certs:ro]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8301/_test/health', timeout=3)"], interval: 3s, retries: 20}
    depends_on: {certs: {condition: service_completed_successfully}}
    mem_limit: 96m

  fake-8028:
    <<: *tools
    command: [python, /tools/fake_8028.py]
    environment:
      FAKE_8028_CLIENT_SECRET: ${SMS8028_CLIENT_SECRET}
    networks:
      stack:
        aliases: [sms8028.example.invalid]
    volumes: [certs:/certs:ro]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8302/_test/health', timeout=3)"], interval: 3s, retries: 20}
    depends_on: {certs: {condition: service_completed_successfully}}
    mem_limit: 64m

  tg-gateway:
    # Stand-in for the APISIX webhook route (spec §5.3).
    <<: *tools
    command: [python, /tools/tg_gateway.py]
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    environment:
      TG_WEBHOOK_SECRET: ${TG_WEBHOOK_SECRET}
    networks:
      stack:
        aliases: [webhook.example.invalid]
    volumes: [certs:/certs:ro]
    depends_on: {certs: {condition: service_completed_successfully}}
    mem_limit: 64m

  stubs:
    # DA backend, Auth, beneficiary API, Master Data, Marketplace and the fake clock.
    <<: *hardened
    image: oan-tg/stubs:local
    build: {context: ../stubs}
    environment:
      OAN_STUBS_CLIENT_ID: ${OAN_STUBS_CLIENT_ID}
      OAN_STUBS_CLIENT_SECRET: ${OAN_STUBS_CLIENT_SECRET}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8200/healthz', timeout=2)"], interval: 3s, retries: 20}
    mem_limit: 96m

  # ---------------------------------------------------------------- OAN Bot Services
  bot-migrate:
    <<: *bot
    restart: "no"
    command: [python, -m, oan_bot_services, migrate]
    depends_on:
      oan-db: {condition: service_healthy}
      certs: {condition: service_completed_successfully}
    mem_limit: 160m

  bot-services:
    <<: *bot
    command: [python, -m, oan_bot_services, api, --host, 0.0.0.0, --port, "8100"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"], interval: 5s, retries: 30}
    depends_on:
      bot-migrate: {condition: service_completed_successfully}
      stubs: {condition: service_healthy}
    mem_limit: 192m

  bot-worker:
    # One replica (advisory lock): handles updates, sends replies, submits broadcast
    # copies to OAN Messaging, polls results, cancels withdrawn copies.
    <<: *bot
    command: [python, -m, oan_bot_services, worker]
    depends_on:
      bot-migrate: {condition: service_completed_successfully}
      stubs: {condition: service_healthy}
    mem_limit: 160m

  # ---------------------------------------------------------------- OAN Messaging
  oan-api:
    <<: *oan
    environment: *oan-tg-keys
    command: [uvicorn, --factory, oan_messaging.runtime.api:create_app, --host, 0.0.0.0, --port, "8000",
              --ssl-certfile, /certs/oan-api.crt, --ssl-keyfile, /certs/oan-api.key]
    healthcheck: {test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://localhost:8000/readyz', context=ssl.create_default_context(cafile='/certs/ca.crt'))"], interval: 3s, retries: 30}
    depends_on:
      oan-grants: {condition: service_completed_successfully}
    mem_limit: 192m

  oan-worker-sms:
    # SMS only, with no Telegram setting at all (no token, no broadcast switch).
    <<: *oan
    environment:
      <<: *oan-keys
      OAN_MSG_WORKER_CHANNELS: sms
      OAN_MSG_SMS8028_BASE_URL: https://sms8028.example.invalid:3400/sms-api/v1
      OAN_MSG_SMS8028_CLIENT_SECRET: ${SMS8028_CLIENT_SECRET}
      OAN_MSG_SMS8028_CLIENT_CERT: /certs/oan-8028-client.crt
      OAN_MSG_SMS8028_CLIENT_KEY: /certs/oan-8028-client.key
      OAN_MSG_SMS8028_CA_CERT: /certs/ca.crt
    command: [python, -m, oan_messaging.runtime, worker]
    depends_on:
      oan-grants: {condition: service_completed_successfully}
      fake-8028: {condition: service_healthy}
    mem_limit: 192m

  oan-worker-telegram:
    # Telegram only. Started by up.sh after the caller is registered: the worker refuses
    # to start while an enabled Telegram caller has no token.
    <<: *oan
    environment:
      <<: *oan-tg-keys
      OAN_MSG_WORKER_CHANNELS: telegram
      OAN_MSG_TELEGRAM_BOT_TOKEN__OAN: ${TG_BOT_TOKEN}
    command: [python, -m, oan_messaging.runtime, worker]
    depends_on:
      oan-grants: {condition: service_completed_successfully}
      fake-telegram: {condition: service_healthy}
    mem_limit: 192m

  oan-cleanup:
    <<: *oan
    environment: *oan-keys
    command: [python, -m, oan_messaging.runtime, cleanup, --forever]
    depends_on:
      oan-grants: {condition: service_completed_successfully}
    mem_limit: 160m

  # ---------------------------------------------------------------- host access
  edge:
    image: oan-tg/edge:local
    build: {context: ./tools, dockerfile: ../images/edge/Dockerfile}
    read_only: true
    tmpfs: [/tmp]
    # NET_ADMIN only to install the outbound firewall; the forwarder runs without it.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    environment:
      EDGE_ALLOW_CIDR: 172.31.231.0/24
      EDGE_ROUTES: 28301=fake-telegram:8301,28302=fake-8028:8302,28443=tg-gateway:443,28100=bot-services:8100,28200=stubs:8200,28000=oan-api:8000
    networks: [stack, edge]
    ports:
      - 127.0.0.1:28301:28301
      - 127.0.0.1:28302:28302
      - 127.0.0.1:28443:28443
      - 127.0.0.1:28100:28100
      - 127.0.0.1:28200:28200
      - 127.0.0.1:28000:28000
    restart: unless-stopped
    mem_limit: 64m

volumes:
  certs: {}
  oan-db: {}

networks:
  stack:
    name: oan-tg-stack
    internal: true
    ipam: {config: [{subnet: 172.31.231.0/24}]}
  edge:
    name: oan-tg-edge
    ipam: {config: [{subnet: 172.31.232.0/24}]}

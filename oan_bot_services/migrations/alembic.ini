# Alembic configuration for OAN Bot Services (its own database).
# Run from the repository root:  alembic -c oan_bot_services/migrations/alembic.ini upgrade head
# The database URL comes from OAN_BOT_DATABASE_URL (never stored here).
[alembic]
script_location = %(here)s
path_separator = os
prepend_sys_path = %(here)s/../..
version_table = bot_alembic_version

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
